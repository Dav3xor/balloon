<head>
  <style> body { margin: 0; } </style>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
  <!--<script src="../../dist/globe.gl.js"></script>-->
</head>

<body>
  <div>National Reconnaisance Orifice</div>
  <div id="globeViz"></div>

  <script type="module">

    import { scaleSequentialSqrt } from 'https://esm.sh/d3-scale';
    import { interpolateYlOrRd } from 'https://esm.sh/d3-scale-chromatic';

    const colorScale = scaleSequentialSqrt(interpolateYlOrRd);
    
    const targets = {{ targets|safe }};
    /*
    new Globe(document.getElementById('globeViz'))
      .pointsData(targets)
      .pointAltitude('a')
      .pointRadius('r')
      .pointColor('c');
    */ 
    
    // GDP per capita (avoiding countries with small pop)
    const getVal = feat => feat.properties.GDP_MD_EST / Math.max(1e5, feat.properties.POP_EST);

    fetch('/static/ne_110m_admin_0_countries.geojson').then(res => res.json()).then(countries =>
    {
      const maxVal = Math.max(...countries.features.map(getVal));
      colorScale.domain([0, maxVal]);

      const world = new Globe(document.getElementById('globeViz'))
        .pointsData(targets)
        .pointAltitude('a')
        .pointRadius('r')
        .pointColor('c')
        
        //.globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg')
        //.backgroundImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png')
        .lineHoverPrecision(0)
        .polygonsData(countries.features.filter(d => d.properties.ISO_A2 !== 'AQ'))
        .polygonAltitude(0.01)
        //.polygonCapColor(feat => colorScale(getVal(feat)))
        .polygonCapColor(feat => 'rgba(100,70,70,1.0)')
        .polygonSideColor(() => 'rgba(100, 70, 70, 0.5)')
        .polygonStrokeColor(() => '#111')
        .polygonLabel(({ properties: d }) => `
          <b>${d.ADMIN} (${d.ISO_A2}):</b> <br />
          GDP: <i>${d.GDP_MD_EST}</i> M$<br/>
          Population: <i>${d.POP_EST}</i>
        `)
        .onPolygonHover(hoverD => world
          .polygonAltitude(d => d === hoverD ? 0.03 : 0.01)
          .polygonCapColor(d => d === hoverD ? 'steelblue' : 'rgba(100,70,70,1.0)')
          //.polygonCapColor(d => d === hoverD ? 'steelblue' : colorScale(getVal(d)))
        )
        .polygonsTransitionDuration(300);

    });
  </script>
</body>
